name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy using SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07aca3c7abb49f909" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot" \
            --timeout-seconds 600 \
            --parameters 'commands=[
                "set -e",
                "git config --system --add safe.directory /home/ubuntu/5th-project-with_kim-server-2026",
                "cd /home/ubuntu/5th-project-with_kim-server-2026",
                "git fetch origin main",
                "git reset --hard origin/main",
                "echo Deploying commit: $(git log -1 --oneline)",
                "sudo docker-compose down",
                "sudo docker-compose build --no-cache",
                "sudo docker-compose up -d"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "Command ID: $COMMAND_ID"

      - name: Wait for deployment to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
            --instance-id "i-07aca3c7abb49f909" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
            --instance-id "i-07aca3c7abb49f909" \
            --query "Status" --output text)

          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
            --instance-id "i-07aca3c7abb49f909" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
              --instance-id "i-07aca3c7abb49f909" \
              --query "StandardErrorContent" --output text
            exit 1
          fi